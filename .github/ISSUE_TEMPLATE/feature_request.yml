name: Feature request
description: Suggest a new option or improvement to the dice tray.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. The guiding principle for this module is **simple by default,
        configurable when you need it** — suggestions that keep the tray quick to use are
        the easiest to say yes to.

  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What are you trying to do that the module makes hard or impossible today?
      placeholder: >-
        My game uses exploding d6s, and there's no button for them, so I have to type
        the formula every time.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the feature or change. If it adds a button or setting, say roughly where it would sit.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the module?
      options:
        - Dice tray in the chat sidebar
        - Pop-out dice tray window
        - Roll result in chat
        - Dice row configuration (GM settings)
        - Support for a game system
        - Compatibility with another module
        - Something else
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any workarounds you're using now, or other ways this could be solved.

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched the existing issues and this hasn't already been suggested.
          required: true
