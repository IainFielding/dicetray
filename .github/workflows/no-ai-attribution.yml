# Blocks AI-agent attribution (co-author trailers, tool sign-offs, bot addresses) from
# entering commit history. The .githooks/commit-msg hook gives the same feedback locally,
# but a hook is advisory — it can be skipped with --no-verify and doesn't run on forks —
# so this workflow is the actual enforcement point, at PR time and before merge.
name: No AI Attribution

on:
  pull_request:
    branches: ["**"]

jobs:
  check-commit-messages:
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR commits
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Scan commit messages for AI attribution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          AI_ATTRIBUTION='(^[[:space:]]*Co-[Aa]uthored-[Bb]y:[[:space:]]*(Claude|Claude Code|Claude Opus[^<]*|Claude Sonnet[^<]*|GitHub Copilot|Copilot|ChatGPT|OpenAI Codex|Codex|Gemini|Cursor|Cursor Agent|Devin AI|Windsurf|Codeium|Tabnine)[[:space:]]*<)|(^[[:space:]]*Co-[Aa]uthored-[Bb]y:.*<[^>]*(noreply@anthropic\.com|noreply@openai\.com|\[bot\]@users\.noreply\.github\.com)>)|(Generated with \[?(Claude Code|GitHub Copilot|Cursor|Codex|Gemini|ChatGPT))|(🤖 Generated)'
          fail=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            msg=$(git log -1 --format=%B "$sha")
            if printf '%s' "$msg" | grep -qE "$AI_ATTRIBUTION"; then
              echo "::error::Commit $sha contains AI-agent attribution:"
              printf '%s' "$msg" | grep -nE "$AI_ATTRIBUTION" | sed 's/^/    /'
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Remove the attribution line(s) and force-push the corrected branch."
            exit 1
          fi
          echo "No AI attribution found in PR commit messages."
